<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#262626">
<title>تناتيش | الكاشير</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.png" alt="تناتيش">
  <div><h1>تناتيش</h1><small>كل ما تحتاجه مطبخك</small></div>
</header>
<main>
<section id="sale" class="panel on">
  <div class="card">
    <h2>فاتورة جديدة</h2>
    <input id="q" placeholder="ابحث عن منتج..." oninput="renderSale()">
    <div id="chips" class="chips"></div>
    <div id="plist" class="pgrid"></div>
  </div>
  <div class="card">
    <h2>سلة الفاتورة</h2>
    <div id="cart"></div>
    <div class="row2">
      <div><label>خصم (ج.م)</label><input id="disc" type="number" min="0" inputmode="decimal" oninput="renderCart()"></div>
      <div><label>المبلغ المدفوع</label><input id="paid" type="number" min="0" inputmode="decimal" oninput="renderCart()"></div>
    </div>
    <div class="sum"><span>المجموع</span><span id="sub"></span></div>
    <div class="sum big"><span>الإجمالي</span><span id="total"></span></div>
    <div id="change" class="change"></div>
    <button class="btn gold" data-a="checkout">تأكيد البيع وإصدار الفاتورة</button>
  </div>
</section>

<section id="products" class="panel">
  <div class="card">
    <h2 id="ptitle">إضافة منتج</h2>
    <label>اسم المنتج</label><input id="pn" placeholder="مثال: طقم معالق">
    <label>القسم</label><input id="pc" list="cats" placeholder="مثال: أواني، أدوات مطبخ"><datalist id="cats"></datalist>
    <div class="row2">
      <div><label>سعر الشراء</label><input id="pb" type="number" min="0" inputmode="decimal"></div>
      <div><label>سعر البيع</label><input id="ps" type="number" min="0" inputmode="decimal"></div>
      <div><label>الكمية</label><input id="pq" type="number" min="0" inputmode="numeric"></div>
      <div><label>حد التنبيه</label><input id="pm" type="number" min="0" inputmode="numeric" value="3"></div>
    </div>
    <button class="btn" data-a="saveProduct">حفظ المنتج</button>
    <button class="btn light" id="pcancel" data-a="cancelEdit" hidden>إلغاء التعديل</button>
  </div>
  <div class="card"><h2>قائمة المنتجات</h2><div id="productList"></div></div>
</section>

<section id="stock" class="panel">
  <div class="card"><h2>نواقص المخزون</h2><div id="lowList"></div></div>
  <div class="card"><h2>كل المخزون</h2><div id="stockList"></div></div>
</section>

<section id="reports" class="panel">
  <div class="card">
    <h2>التقارير</h2>
    <div id="pers" class="chips"></div>
    <div class="grid" id="stats"></div>
  </div>
  <div class="card"><h2>الأكثر مبيعاً</h2><div id="top"></div></div>
  <div class="card"><h2>سجل الفواتير</h2><div id="salesList"></div></div>
</section>

<section id="settings" class="panel">
  <div class="card">
    <h2>بيانات المحل على الفاتورة</h2>
    <label>رقم التليفون</label><input id="sp" inputmode="tel">
    <label>العنوان</label><input id="sa">
    <label>رسالة آخر الفاتورة</label><input id="sf">
    <button class="btn" data-a="saveSettings">حفظ</button>
  </div>
  <div class="card">
    <h2>النسخ الاحتياطي</h2>
    <p class="muted">بياناتك محفوظة على هذا الجهاز فقط. نزّل نسخة بشكل دوري.</p>
    <button class="btn light" data-a="exportData">تنزيل نسخة احتياطية</button>
    <label>استرجاع نسخة</label><input type="file" id="importFile" accept="application/json" onchange="importData(event)">
    <button class="btn danger" data-a="clearSales">مسح سجل الفواتير</button>
  </div>
</section>
</main>

<nav>
  <button class="on" data-t="sale"><i>🧾</i>الكاشير</button>
  <button data-t="products"><i>🍳</i>المنتجات</button>
  <button data-t="stock"><i>📦</i>المخزون</button>
  <button data-t="reports"><i>📊</i>التقارير</button>
  <button data-t="settings"><i>⚙️</i>الإعدادات</button>
</nav>

<div id="rc" hidden>
  <div class="rbox">
    <div id="rcBody"></div>
    <div class="noprint acts">
      <button class="btn gold" onclick="print()">طباعة / حفظ PDF</button>
      <button class="btn light" data-a="closeRc">إغلاق</button>
      <button class="btn danger" data-a="delSale">حذف الفاتورة</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="app.js"></script>
<script>if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
